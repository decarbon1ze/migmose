[project]
name = "migmose"
description = "Tool to generate machine readable files from MIG documents"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Kevin Krechan", email = "kevin.krechan@hochfrequenz.de" }]
keywords = ["automation", "mig", "bdew", "edi@energy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.1",
    "efoli>=1.4.0",
    "jinja2>=3.1",
    "loguru>=0.7",
    "pydantic>=2.9",
    "python-docx>=1.1",
]

dynamic = ["readme", "version"]

[project.urls]
Homepage = "https://github.com/decarbon1ze/migmose"
Upstream = "https://github.com/Hochfrequenz/migmose"

[project.scripts]
migmose = "migmose.__main__:main"

[dependency-groups]
test = [
    "maus[tree]==0.6.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-loguru==0.4.1",
    "syrupy==5.3.1",
]
lint = ["ruff==0.17.3"]
typecheck = [
    "ty==0.0.107",
    { include-group = "test" },
]
spelling = ["codespell==2.4.3"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "spelling" },
]

[tool.ruff]
line-length = 120
extend-exclude = ["src/_migmose_version.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.per-file-ignores]
# the docstring links to a file of MAUS at a fixed commit
"src/migmose/mig/segmentgrouphierarchies.py" = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.ty.src]
exclude = ["src/_migmose_version.py"]

[tool.pytest.ini_options]
testpaths = ["unittests"]

[tool.coverage.run]
omit = ["unittests/*", "src/migmose/__main__.py", "src/_migmose_version.py"]

[tool.codespell]
ignore-words = "domain-specific-terms.txt"

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"


[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_migmose_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
