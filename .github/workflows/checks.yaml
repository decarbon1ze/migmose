name: "checks"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests and measure the coverage
        run: uv run --frozen --group test pytest --cov migmose --cov-report term-missing --cov-fail-under 80

  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check:
          - name: lint
            run: uv run --frozen --group lint ruff check
          - name: formatting
            run: uv run --frozen --group lint ruff format --check
          - name: typecheck
            run: uv run --frozen --group typecheck ty check
          - name: spelling
            run: uv run --frozen --group spelling codespell src README.md
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}
